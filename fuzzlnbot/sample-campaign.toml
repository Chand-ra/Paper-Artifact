# Sample fuzzlnbot campaign configuration for fuzzing LND with the encrypted_bytes scenario on 8 cores.

# Target Lightning implementation (lnd, ldk, cln, eclair).
target = "lnd"

# Fuzzing scenario.
scenario = "encrypted_bytes"

# Path to AFL++ source tree.
aflpp_path = "/home/user/AFLplusplus"

# Path to fuzzln repository root.
fuzzln_dir = "."

# Number of parallel AFL++ instances to launch.
runners = 8

# Seed corpus directory (optional; omit to start from an empty corpus).
seed_dir = "/tmp/fuzzln-seeds"

# AFL++ output directory.
output_dir = "/tmp/fuzzln-out"

# Nyx shared directory path; created automatically by `fuzzlnbot start`.
sharedir = "/tmp/fuzzln-nyx"

# Docker image tag override (default: fuzzln-<target>-<scenario>).
# image = "fuzzln-lnd-encrypted_bytes"

# Custom tmux session name (default: campaign ID).
# tmux_session = "my-lnd-campaign"

# Extra CLI flags appended to afl-fuzz.
# afl_flags = ["-t", "1000+"]

# Extra environment variables passed to AFL++ instances.
# [afl_env]
# AFL_KEEP_TIMEOUTS = "1"
